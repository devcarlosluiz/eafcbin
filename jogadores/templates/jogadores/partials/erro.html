<div class="painel mt-8 border-rose-500/25 bg-rose-500/[.06] px-6 py-10 text-center">
  <p class="font-display text-2xl font-bold text-rose-200">{{ erro_titulo }}</p>
  <p class="mx-auto mt-3 max-w-2xl text-sm leading-relaxed text-rose-100/70">{{ erro }}</p>

  {% if sem_credenciais %}
    <div class="mx-auto mt-6 max-w-lg rounded-xl border border-white/10 bg-night-900/60 p-4 text-left">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
        Preencha o <code>.env</code> na raiz do projeto
      </p>
      <pre class="mt-2 overflow-x-auto text-sm text-emerald-300">ARENA_LOGIN=seu_usuario
ARENA_SENHA=sua_senha</pre>
      <p class="mt-3 text-xs text-slate-500">
        Depois reinicie o servidor (ou <code>docker compose up -d</code>).
      </p>
    </div>
  {% endif %}
</div>
